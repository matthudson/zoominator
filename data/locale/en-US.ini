Dialog.CenterCursorUntilEdge="Keep cursor centered until the capture reaches an edge"
Dialog.CenterCursorUntilEdgeTooltip="Maps the full captured monitor to the full captured scene content, which improves ultrawide tracking and clamps only when an edge is reached."
Dialog.EdgeOverflowMargin="Edge Overflow Margin"
Dialog.EdgeOverflowMarginTooltip="Allows the canvas to overflow outside the screen borders when moving near edges. 0% locks at screen boundaries, 50% keeps the cursor centered at 50%, and intermediate percentages allow partial border overflow."
