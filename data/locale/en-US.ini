Dialog.ShowViewportBorder="Show the visible viewport boundary above the activation zoom"
Dialog.ShowViewportBorderTooltip="Displays a click-through border outside the area visible in OBS. The included Display Capture source must explicitly use Windows Graphics Capture; Automatic/DXGI capture cannot exclude overlay windows, so the guide stays hidden."
Dialog.AllowUnsafeViewportBorder="Show anyway when capture exclusion cannot be guaranteed"
Dialog.AllowUnsafeViewportBorderTooltip="Allows the guide with Automatic/DXGI Display Capture. The border may then appear in OBS recordings and previews."
Dialog.ViewportGuide.Status.Disabled="Viewport guide: disabled."
Dialog.ViewportGuide.Status.Compatible="Viewport guide: Windows Graphics Capture is selected and Zoominator has requested capture exclusion. Verify once in the OBS preview because Windows and graphics-driver behaviour can vary."
Dialog.ViewportGuide.Status.Incompatible="Viewport guide is hidden: the included Display Capture source uses Automatic/DXGI, which may capture the border. Select Windows 10 (1903 and up) in that source's Properties, or enable Show anyway below."
Dialog.ViewportGuide.Status.Override="Viewport guide override enabled: the border may appear in OBS previews and recordings with Automatic/DXGI capture."
